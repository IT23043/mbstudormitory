<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Institutional Login | MBSTU Dormitory</title>
  <link rel="icon" type="image/png" href="MBSTU_logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="MBSTU_logo.png" alt="MBSTU Logo" class="brand-logo">
        <div>
          <span class="fw-bold text-dark fs-5">MBSTU</span>
          <span class="text-primary fw-bold fs-5">Dormitory</span>
        </div>
      </a>
      <div class="ms-auto">
        <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
          Back to Home
        </a>
      </div>
    </div>
  </nav>

  <!-- Login Container -->
  <div class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="premium-card p-4 p-md-5 bg-white border">
            
            <div class="text-center mb-4">
              <h3 class="fw-bold text-dark mb-1">Institutional Login</h3>
              <p class="text-muted small">Sign in using your MBSTU domain credentials (<code>@mbstu.acu.bd</code>)</p>
            </div>

            <!-- Role Selector Pill Tabs -->
            <div class="d-flex p-1 bg-light rounded-pill mb-4 border">
              <button class="btn role-pill-btn flex-fill active" id="btn-role-student" onclick="setRole('student')">
                Student Portal
              </button>
              <button class="btn role-pill-btn flex-fill text-muted" id="btn-role-authority" onclick="setRole('authority')">
                Hall Authority
              </button>
            </div>

            <!-- Error Banner -->
            <div id="login-error-alert" class="alert alert-danger py-2 px-3 small rounded-2 d-none mb-3" role="alert">
              <span id="login-error-text"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
              <div class="mb-3">
                <label for="email" class="form-label small fw-semibold text-secondary">
                  Institutional Email Address
                </label>
                <input type="email" class="form-control" id="email" required placeholder="e.g. yourname@mbstu.acu.bd">
                <div class="form-text small text-muted">
                  Domain must end with <strong>@mbstu.acu.bd</strong> or <strong>@mbstu.ac.bd</strong>
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="password" class="form-label small fw-semibold text-secondary mb-0">Password</label>
                </div>
                <input type="password" class="form-control" id="password" required placeholder="Enter password">
              </div>

              <div class="d-flex align-items-center justify-content-between mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                  <label class="form-check-label small text-secondary" for="rememberMe">
                    Remember session
                  </label>
                </div>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary py-2 rounded-pill fw-semibold" id="btnLoginSubmit">
                  Authenticate &amp; Enter
                </button>
              </div>

              <div class="text-center small text-muted">
                New student? <a href="register.html" class="fw-semibold text-primary text-decoration-none">Register Profile</a>
              </div>
            </form>

            <hr class="my-4">

            <!-- 1-Click Demo Credentials for Evaluation -->
            <div class="p-3 bg-light rounded border">
              <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="small fw-bold text-dark">Demo Logins (1-Click Fill)</span>
              </div>
              <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-1 px-3" onclick="quickFill('student.male@mbstu.acu.bd', 'student123', 'student')">
                  Male Student
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-1 px-3" onclick="quickFill('student.female@mbstu.acu.bd', 'student123', 'student')">
                  Female Student
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-1 px-3" onclick="quickFill('guest.student@mbstu.acu.bd', 'guest123', 'student')">
                  Non-Resident Student
                </button>
                <button type="button" class="btn btn-sm btn-outline-dark rounded-pill py-1 px-3" onclick="quickFill('provost@mbstu.acu.bd', 'admin123', 'authority')">
                  Hall Provost
                </button>
                <button type="button" class="btn btn-sm btn-outline-dark rounded-pill py-1 px-3" onclick="quickFill('teacher.jamh@mbstu.acu.bd', 'admin123', 'authority')">
                  Assistant Provost
                </button>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    let activeRole = 'student';

    function setRole(role) {
      activeRole = role;
      const btnStudent = document.getElementById('btn-role-student');
      const btnAuthority = document.getElementById('btn-role-authority');

      if (role === 'student') {
        btnStudent.classList.add('active', 'text-white');
        btnStudent.classList.remove('text-muted');
        btnAuthority.classList.remove('active', 'text-white');
        btnAuthority.classList.add('text-muted');
      } else {
        btnAuthority.classList.add('active', 'text-white');
        btnAuthority.classList.remove('text-muted');
        btnStudent.classList.remove('active', 'text-white');
        btnStudent.classList.add('text-muted');
      }
    }

    function quickFill(email, pwd, role) {
      setRole(role);
      document.getElementById('email').value = email;
      document.getElementById('password').value = pwd;
      document.getElementById('login-error-alert').classList.add('d-none');
      App.toast(`Filled demo credentials for ${email}`, 'info');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const errorBox = document.getElementById('login-error-alert');
      const errorText = document.getElementById('login-error-text');
      const submitBtn = document.getElementById('btnLoginSubmit');

      errorBox.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Verifying...';

      try {
        const user = await Auth.login(email, password, activeRole, rememberMe);
        App.toast(`Welcome back, ${user.name}!`, 'success');
        
        setTimeout(() => {
          if (user.role === 'authority') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'student-dashboard.html';
          }
        }, 600);
      } catch (err) {
        errorText.innerText = err.message || 'Login failed';
        errorBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Authenticate &amp; Enter';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await DB.init();
      const user = Auth.getUser();
      if (user) {
        if (user.role === 'authority') window.location.href = 'admin-dashboard.html';
        else window.location.href = 'student-dashboard.html';
      }
    });
  </script>
</body>
</html>
